<section class="sprite-preview">
  <style>
    .sprite-preview {
      padding: 20px 40px;
      margin: 20px auto;
      max-width: 1280px;
      border: 1px solid #eaeaea;
      background: #fff;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #1f2933;
    }
    .sprite-preview h2 {
      margin: 0 0 24px;
      font-size: 24px;
      font-weight: 600;
    }
    .sprite-preview__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
    }
    .sprite-preview__item {
      background: #fff;
      border-radius: 12px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border: 1px solid #eaeaea;
    }
    .sprite-preview__icon {
      width: 48px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }
    .sprite-preview__icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 0;
    }
    .sprite-preview__id {
      font-size: 12px;
      font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #f1f5f9;
      color: #475569;
      border-radius: 6px;
      padding: 4px 8px;
      word-break: break-all;
    }
    @media (max-width: 640px) {
      .sprite-preview {
        padding: 24px 16px;
      }
      .sprite-preview__grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
    }
  </style>
