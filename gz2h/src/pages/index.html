<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />

		<title>gz2h</title>
	</head>

	<body>
		<div class="global-wrapper">
			<div class="main">
				<div class="mbox">
					<div class="head-line">
						<h1>LEA</h1>
					</div>
					<div class="wrap">
						<h2>Pages</h2>
						<ol class="box">
							<li>
								<a href="main.html" class="green">Main</a>
							</li>
						</ol>
						@@include('../partials/sprite-preview.html')
					</div>
				</div>
			</div>
			<style>
				body {
					font-family: Roboto, Helvetica, Arial, sans-serif;
					font-size: 16px;
					background-color: #fafafa;
					color: #212121;
					margin: 0;
					cursor: initial;
					opacity: 1 !important;
					pointer-events: all !important;
				}

				.head-line {
					background-color: #fff;
					text-align: center;
				}

				.head-line h1 {
					margin: 0 auto;
					padding: 20px 10px;
					max-width: 1280px;
					min-height: 68px;
					box-sizing: border-box;
					color: #000;
					font-size: 24px;
					word-wrap: break-word;
				}

				.wrap {
					padding: 10px;
					text-align: center;
					overflow: hidden;
				}

				h5 {
					text-align: center;
					position: relative;
					display: inline-block;
					max-width: 1280px;
					margin: 30px 0 10px;
					padding: 0 20px;
					font-size: 30px;
				}

				h5:before {
					content: '';
					position: absolute;
					height: 1px;
					width: 1280px;
					background-color: #eaeaea;
					top: 50%;
					left: 50%;
					-webkit-transform: translateX(-50%);
					transform: translateX(-50%);
					z-index: -1;
				}

				.mbox-footer {
					max-width: 1280px;
					margin: 0 auto;
				}

				a {
					color: #212121;
					text-decoration: none;
				}

				a.green {
					color: green;
				}

				a:hover {
					color: #212121;
					text-decoration: underline;
				}

				.box {
					padding: 20px 40px;
					margin: 20px auto;
					width: 100%;
					max-width: 1280px;
					border-radius: 8px;
					box-sizing: border-box;
					border: 1px solid #eaeaea;
					background-color: #fff;
					text-align: left;
				}

				ol,
				ul {
					list-style-type: none;
				}

				li {
					box-sizing: border-box;
					width: 100%;
					padding: 10px 15px;
				}
			</style>
		</div>
	</body>
</html>
